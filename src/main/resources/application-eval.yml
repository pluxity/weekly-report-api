# eval 프로파일 — 로컬 결정적 seed 데이터 전용 (EvalDataSeeder)
# 실행: --spring.profiles.active=local,eval  (local 위에 얹어 datasource만 오버라이드)
# 전용 eval DB를 향하게 해 seed wipe/재삽입이 실 개발 DB(weekly_report)를 건드리지 않게 한다.
# ddl-auto/flyway 등 나머지 설정은 common/local 상속.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/weekly_report_eval
    username: pluxity
    password: pluxity0304
    driver-class-name: org.postgresql.Driver
  # 빈 eval DB에선 Flyway 증분 마이그레이션(ALTER users …)이 ddl-auto의 테이블 생성보다 먼저 돌아
  # "relation users does not exist"로 실패한다. eval DB는 엔티티가 전체 스키마를 정의하므로
  # Flyway를 끄고 ddl-auto=update가 엔티티로 스키마를 통째로 생성하게 한다.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: update
